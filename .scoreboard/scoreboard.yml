    status: warning
    overall_effective_score: 8.2
    last_evaluated: 2026-08-10
    minimum_overall_effective_score: 8
    required:
      security_privacy: 8
      tests: 7
      readme_onboarding: 7
      ci_cd: 7
      agent_readiness: 8
    notes:
      - "Quality gates use effective_score."
      - "User overrides may satisfy a numeric gate, but risk_flags must remain visible."
      - "If a gate is satisfied only because of user_score while ai_score is low, mark the relevant aspect as accepted_debt or risk_accepted."
      - "If required aspects have active risk_flags, mention them in SCOREBOARD.md even when the gate numerically passes."
      - "All required-aspect thresholds (security_privacy 8, tests 7, readme_onboarding 7, ci_cd 7, agent_readiness 8) pass; gate is 'warning' (not 'pass') because ci_cd has an active blocked_manual_workflow_edit risk."

