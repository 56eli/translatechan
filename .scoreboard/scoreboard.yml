    - "Branch protection on main does not require the Quality check; PRs can merge without the gate (owner action)."
    - "Robo renderings (reconstruction_unverified) form 72% of all translation slots (966/1342) — by design, but worth re-stating for any new contributor or auditor."

quality_gates:
