<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Fake Chan Factory — disclosed Robo registers over source-tracked Classical Chan texts">
  <!-- The hall: walnut wall with timber posts and a top beam -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a120e"/>
      <stop offset="0.4" stop-color="#241a14"/>
      <stop offset="1" stop-color="#221810"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c211c"/>
      <stop offset="1" stop-color="#1d1310"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e4"/>
      <stop offset="1" stop-color="#f0e7d2"/>
    </linearGradient>
    <pattern id="posts" width="190" height="630" patternUnits="userSpaceOnUse">
      <rect x="188" width="2" height="630" fill="#0c0705" fill-opacity="0.5"/>
      <rect x="187" width="1" height="630" fill="#d6b27c" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#wall)"/>
  <rect width="1200" height="630" fill="url(#posts)"/>
  <ellipse cx="600" cy="-40" rx="620" ry="180" fill="#d6b27c" fill-opacity="0.07"/>

  <!-- Top beam with carved gold edge -->
  <rect width="1200" height="86" fill="url(#beam)"/>
  <rect y="84" width="1200" height="3" fill="#c9a66b"/>
  <g transform="translate(56 23)">
    <rect width="40" height="40" fill="#c9a66b"/>
    <text x="20" y="29" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#211814">FC</text>
    <text x="54" y="25" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#f3ead9">FAKE CHAN FACTORY</text>
    <text x="1144" y="32" text-anchor="end" font-family="monospace" font-size="13" letter-spacing="2" fill="#cdbda7">READ · COMPARE · LINEAGE · CASES · TERMS</text>
  </g>

  <!-- Hanging paper sheet -->
  <g transform="translate(300 126)">
    <rect x="-6" y="-14" width="612" height="12" rx="3" fill="#2c211c" stroke="#0d0907"/>
    <rect x="-6" y="-14" width="612" height="12" rx="3" fill="none" stroke="#d6b27c" stroke-opacity="0.18"/>
    <rect y="0" width="600" height="404" fill="url(#sheet)" stroke="#b9a683"/>
    <line x1="300" y1="26" x2="300" y2="378" stroke="#785e3a" stroke-opacity="0.1"/>

    <!-- Headband -->
    <line x1="48" y1="52" x2="552" y2="52" stroke="#b9a683" stroke-width="3"/>
    <line x1="48" y1="57" x2="552" y2="57" stroke="#b9a683" stroke-width="1"/>
    <rect x="48" y="76" width="10" height="10" fill="#a83a2c"/>
    <text x="68" y="86" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2.5" fill="#724e1e">ROOM 01 · READING HALL</text>
    <text x="48" y="146" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#2c2523">Source-tracked Chan texts.</text>
    <text x="48" y="192" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#8b622b">Disclosed Robo registers.</text>

    <!-- Folio lines -->
    <g stroke="#d8cbb8" stroke-width="1">
      <line x1="48" y1="238" x2="552" y2="238"/>
      <line x1="48" y1="306" x2="552" y2="306"/>
    </g>
    <text x="293" y="246" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#8b622b">◆</text>
    <text x="293" y="314" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#8b622b">◆</text>
    <g fill="#3a2f28">
      <rect x="48" y="256" width="150" height="12" rx="1" opacity="0.75"/>
      <rect x="206" y="256" width="100" height="12" rx="1" opacity="0.45"/>
      <rect x="48" y="324" width="216" height="12" rx="1" opacity="0.6"/>
      <rect x="272" y="324" width="140" height="12" rx="1" opacity="0.4"/>
    </g>
    <text x="48" y="290" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#4a4238">35 source-tracked works · 21 comparison registers · every Robo disclosed</text>
    <rect x="512" y="352" width="16" height="16" fill="#a83a2c"/>
  </g>

  <text x="1144" y="602" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2" fill="#cdbda7">56ELI.GITHUB.IO/TRANSLATECHAN</text>
</svg>
