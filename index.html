<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>禪宗法脈 · Translatechan v2</title>
<style>
:root{--bg:#f4efe4;--card:#fbf8f1;--ink:#2a2622;--mut:#7a7164;--line:#d2c8b2;--acc:#3f66a0;--ok:#4a7a3a;--warn:#a0623a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17171a;--card:#202024;--ink:#ece6d8;--mut:#a39b8a;--line:#3a3a40;--acc:#8fb0e0;--ok:#8fb67a;--warn:#c99a78}}
:root[data-theme=dark]{--bg:#17171a;--card:#202024;--ink:#ece6d8;--mut:#a39b8a;--line:#3a3a40;--acc:#8fb0e0;--ok:#8fb67a;--warn:#c99a78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Serif SC","Songti SC",Georgia,serif}a{color:var(--acc)}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.ring{width:32px;height:32px;border:5px solid var(--ink);border-radius:50%;border-right-color:transparent;transform:rotate(-30deg)}.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}.brand b{font-size:21px;letter-spacing:.1em}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{padding:5px 12px;border-radius:99px;text-decoration:none;color:var(--ink);font-size:14px}nav a.on{background:var(--ink);color:var(--bg)}
input,button,.btn{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-decoration:none;display:inline-block}button{cursor:pointer}input{min-width:0}
main{max-width:1180px;margin:0 auto;padding:18px}h1{font-weight:500;margin:.2em 0}h1 small{font-size:14px;color:var(--mut);margin-left:8px}.mut{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.lin{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.tree{overflow:auto;max-height:76vh;background:var(--card);border:1px solid var(--line);border-radius:12px}.lin aside{align-self:start;position:sticky;top:12px}.zh{font-size:32px;letter-spacing:.1em}
.tree path{fill:none;stroke:var(--mut);stroke-opacity:.5;stroke-width:1.6}.n{cursor:pointer}.n text{text-anchor:middle;fill:var(--ink);font-size:13px}.n .en{font-size:10px;fill:var(--mut)}.n.sel circle{stroke:var(--ink);stroke-width:3}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{border-radius:99px;opacity:.5}.chip.on{opacity:1;box-shadow:inset 0 0 0 1px var(--c)}.n.off{opacity:.12}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500}
.tag{font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}.ok{color:var(--ok);border-color:var(--ok)}.wn{color:var(--warn);border-color:var(--warn)}
.wiki{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px}.wiki h2{border-bottom:1px solid var(--line);font-weight:500;margin-top:1.4em}.info{order:2;align-self:start}.info td:first-child{color:var(--mut)}
.src{font-size:1.35em;letter-spacing:.05em;margin:.4em 0}.case{padding:14px 0;border-bottom:1px dotted var(--line)}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.gal svg{width:100%;background:var(--bg);border-radius:8px}
@media(max-width:800px){.lin,.wiki{grid-template-columns:1fr}.lin aside{order:-1;position:static}.info{order:0}}
</style></head><body>
<header><a class="brand" href="#lineage"><span class="ring"></span><b>禪宗法脈</b></a>
<nav id="nv"><a href="#lineage">Lineage</a><a href="#library">Library</a><a href="#terms">Terms</a><a href="#gallery">Gallery</a><a href="#account" id="ac2">Sign in</a></nav>
<button onclick="var d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'light':'dark'">◐</button></header>
<main id="m"><p class="mut">Loading…</p></main>
<script>
const $=s=>document.querySelector(s),main=$("#m"),J=u=>fetch("../data/"+u).then(r=>r.json());
const e=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const user=()=>{try{return localStorage.getItem("tc")}catch(x){return null}};
const W1={collated_to_claimed_witness:["Collated to witness","ok"],partial_or_failed_w1_collation:["Partial W1 collation","wn"],witness_unavailable:["Witness unavailable","wn"]};
const badge=s=>{const w=W1[s]||[s||"unknown","wn"];return `<span class="tag ${w[1]}">${w[0]}</span>`};
let MS=[],by={},MF=[],TM=[],sel="huineng",off=new Set,pg=0;
const hue=k=>{let h=0;for(const c of k||"x")h=(h*31+c.charCodeAt(0))%360;return h},col=m=>`hsl(${hue(m.school_key)} 45% 45%)`;
function layout(){MS.forEach(m=>{by[m.id]=m;m.kids=[]});const R=[];MS.forEach(m=>{const p=by[m.teacher];p&&p!==m?p.kids.push(m):R.push(m)});let lf=0,mx=0;
(function L(n,d,seen){if(seen.has(n))return;seen.add(n);n.d=d;mx=Math.max(mx,d);if(!n.kids.length)n.x=lf++;else{n.kids.forEach(k=>L(k,d+1,seen));n.x=n.kids.reduce((a,k)=>a+(k.x||0),0)/n.kids.length}})
.call(0,{kids:R},-1,new Set);return[lf,mx]}
function vLin(){const[lf,mx]=layout(),W=80+lf*120,Hh=70+(mx+1)*80,sc=[...new Set(MS.map(m=>m.school_key))];let s="",n="";
const X=m=>50+m.x*120,Y=m=>40+m.d*80;
MS.forEach(m=>{const q=by[m.teacher];if(q&&q!==m){const y=(Y(q)+Y(m))/2;s+=`<path d="M${X(q)} ${Y(q)}C${X(q)} ${y} ${X(m)} ${y} ${X(m)} ${Y(m)}"/>`}});
MS.forEach(m=>{n+=`<g class="n${off.has(m.school_key)?" off":""}${m.id==sel?" sel":""}" onclick="sel='${m.id}';vLin()" transform="translate(${X(m)} ${Y(m)})"><circle r="10" fill="${col(m)}"/><text y="26">${e(m.name_zh)}</text><text class="en" y="39">${e(m.name_en)}</text></g>`});
const c=by[sel]||MS[0];
main.innerHTML=`<h1>傳法堂 <small>${MS.length} masters · lineage tree</small></h1><div class="chips">${sc.map(k=>`<button class="chip ${off.has(k)?"":"on"}" style="--c:hsl(${hue(k)} 45% 45%)" onclick="off.has('${k}')?off.delete('${k}'):off.add('${k}');vLin()">${e((MS.find(m=>m.school_key==k)||{}).school||k)}</button>`).join("")}</div>
<div class="lin"><div class="tree"><svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}">${s}${n}</svg></div><aside class="card"><div class="zh">${e(c.name_zh)}</div><h3 style="margin:.2em 0">${e(c.name_en)}</h3><p class="mut">${e(c.dates)} · ${e(c.school)}</p><p>${e(c.summary)}</p><span class="tag wn">${e(c.profile_status)}</span><p><a class="btn" href="#master-${c.id}">Open article →</a></p></aside></div>`}
function vMaster(id){const m=by[id];if(!m)return vLin();const L=k=>by[k]?`<a href="#master-${k}">${e(by[k].name_en)}</a>`:e(k);
main.innerHTML=`<p><a href="#lineage">← Lineage</a></p><div class="wiki"><div><h1>${e(m.name_en)} <small>${e(m.name_zh)} · ${e(m.name_pinyin)}</small></h1><p class="mut">${e(m.title)}</p><p style="font-size:18px">${e(m.summary)}</p>${m.key_quote_zh?`<h2>Key saying</h2><p class="src">${e(m.key_quote_zh)}</p><p class="mut">${e(m.key_quote_en)}</p>`:""}<h2>Texts</h2><ul>${(m.texts||[]).map(t=>`<li>${e(t)}</li>`).join("")||"<li class=mut>None recorded</li>"}</ul>${(m.linked_corpus_keys||[]).length?`<h2>In the reading room</h2>${m.linked_corpus_keys.map(k=>`<a class="btn" href="#read-${k}">${e(k)}</a>`).join(" ")}`:""}<h2>Source status</h2><p><span class="tag wn">${e(m.profile_status)}</span></p><p class="mut">${e((m.profile_evidence||{}).note)}</p></div>
<table class="card info"><tr><td>Dates</td><td>${e(m.dates)}</td></tr><tr><td>Era</td><td>${e(m.era)}</td></tr><tr><td>School</td><td>${e(m.school)}</td></tr><tr><td>Place</td><td>${e(m.location)}</td></tr><tr><td>Teacher</td><td>${m.teacher?L(m.teacher):"—"}</td></tr><tr><td>Heirs</td><td>${(m.disciples||[]).map(L).join(", ")||"—"}</td></tr><tr><td>CBETA</td><td>${e(m.cbeta_id)}</td></tr></table></div>`}
function vLib(){const u=user(),rows=MF.filter(i=>u||i.source_review_status=="collated_to_claimed_witness");
main.innerHTML=`<h1>閱藏堂 <small>Library index</small></h1><p class="mut">Public view lists only works collated to their claimed witness. ${u?"Signed in: all works, including unreviewed, are shown.":"Sign in to see works still under review."}</p><div class="sc card"><table><tr><th>Work<th>CBETA<th>Completion<th>Source review</tr>${rows.map(i=>`<tr><td><a href="#read-${i.key}">${e(i.title)}</a><td>${e(i.cbeta)}<td>${e(i.completion_status).replace(/_/g," ")}<td>${badge(i.source_review_status)}</tr>`).join("")}</table></div>`}
async function vRead(k){main.innerHTML="<p class=mut>Loading text…</p>";const it=MF.find(i=>i.key==k);let w;try{w=await J("corpus/"+k+".json")}catch(x){main.innerHTML="<p>Text not found.</p>";return}
if(it&&it.source_review_status!="collated_to_claimed_witness"&&!user()){main.innerHTML="<h1>Under review</h1><p>This work is not yet collated and is not shown publicly. <a href=\"#library\">Back to library</a></p>";return}
const cs=w.cases||[],P=25,pages=Math.ceil(cs.length/P);pg=Math.min(pg,pages-1);
main.innerHTML=`<p><a href="#library">← Library</a></p><h1>${e(w.title_zh)} <small>${e(w.title_en)} · ${e(w.cbeta_id)}</small></h1><p>${badge(it&&it.source_review_status)} <span class="mut">${e(w.author_en)} · ${e(w.era)}</span></p><p class="mut">${e(w.overview)}</p><div class="card" style="max-width:900px">${cs.slice(pg*P,pg*P+P).map(c=>`<div class="case"><b>${e(c.title_zh)}</b> <span class="mut">${e(c.title_en)}</span>${(c.dialogue||[]).map(d=>`<p class="src"><span class="mut" style="font-size:12px">${e(d.speaker)}</span><br>${e(d.zh)}</p>`).join("")}${c.commentary_zh?`<p>${e(c.commentary_zh)}</p>`:""}${c.verse_zh?`<p class="mut">${e(c.verse_zh)}</p>`:""}<span class="mut" style="font-size:12px">${e((c.locator||{}).reference||(c.locator||{}).page_line)}</span></div>`).join("")}<p><button ${pg?"":"disabled"} onclick="pg--;vRead('${k}')">← Prev</button> ${pg+1} / ${pages} <button ${pg<pages-1?"":"disabled"} onclick="pg++;vRead('${k}')">Next →</button></p></div>`}
function vTerms(q){q=(q||"").toLowerCase();const t=TM.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,80);
main.innerHTML=`<h1>詞林 <small>Terms</small></h1><input id="tq" placeholder="Filter terms…" value="${e(q)}" oninput="vTerms(this.value);var i=$('#tq');i.focus();i.setSelectionRange(99,99)"><div class="sc card" style="margin-top:12px"><table>${t.map(x=>`<tr><td class="src">${e(x.term)}<td><b>${e(x.pinyin)}</b> · ${e(x.literal)}<br>${e(x.definition)}</tr>`).join("")}</table></div>`}
function vGal(){const a=['<circle cx="100" cy="100" r="52" fill="none" stroke="currentColor" stroke-width="9" stroke-dasharray="300 40" stroke-linecap="round"/>','<path d="M0 150 L50 70 L90 120 L140 50 L200 140 V200 H0Z" fill="currentColor" opacity=".4"/>','<g stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M70 200V20M110 200V40M150 200V10"/></g>'];
main.innerHTML=`<h1>Gallery</h1><p class="mut">Placeholder studies. Add credited images to data/gallery.json with source and rights.</p><div class="gal">${a.map((x,i)=>`<div class="card"><svg viewBox="0 0 200 200" style="color:var(--ink)">${x}</svg><div class="mut">Credit pending</div></div>`).join("")}</div>`}
function vAcc(){const u=user();main.innerHTML=u?`<h1>Workspace <small>${e(u)}</small></h1><div class="card"><p>Signed in: works still under review are visible in the library.</p><button onclick="try{localStorage.removeItem('tc')}catch(x){}go()">Sign out</button></div>`:`<h1>Sign in</h1><div class="card" style="max-width:380px"><input id="em" placeholder="Email" style="width:100%"><p><button onclick="var v=$('#em').value.trim();if(v){try{localStorage.setItem('tc',v)}catch(x){}go()}">Continue</button></p><p class="mut" style="font-size:13px">UI gate only. Real access control needs a backend; the data files are still public on GitHub Pages.</p></div>`}
function go(){const h=location.hash.slice(1)||"lineage",i=h.indexOf("-"),k=i<0?h:h.slice(0,i),a=i<0?"":h.slice(i+1);$("#ac2").textContent=user()?"Workspace":"Sign in";
document.querySelectorAll("#nv a").forEach(x=>x.classList.toggle("on",x.getAttribute("href")=="#"+(k=="master"?"lineage":k=="read"?"library":k)));
({lineage:vLin,library:vLib,terms:()=>vTerms(""),gallery:vGal,account:vAcc,master:()=>vMaster(a),read:()=>{pg=0;vRead(a)}}[k]||vLin)();scrollTo(0,0)}
Promise.all([J("lineage/masters.json"),J("corpus_manifest.json"),J("glossary/chan_terms.json")]).then(r=>{MS=r[0];MF=r[1].items;TM=r[2];addEventListener("hashchange",go);go()}).catch(x=>{main.innerHTML="<p>Could not load ../data/. Serve the repo root (e.g. python3 -m http.server) and open /v2/.</p>"});
</script></body></html>
