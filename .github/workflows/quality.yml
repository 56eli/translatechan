name: Quality

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-build-pages:
    name: Validate data, source integrity, and Pages mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py

      - name: Validate source data and committed metrics
        run: python3 scripts/validate_data.py

      - name: Rebuild owner-stub Pages artifacts
        run: python3 scripts/build_pages.py

      - name: Enforce source-preservation allowlist (no unauthorized Chinese edits)
        run: python3 scripts/test_source_preservation.py

      - name: Enforce W1 source-review rule suite
        run: python3 scripts/test_source_review_rules.py

      - name: Enforce owner-stub Pages contract
        run: python3 scripts/test_pages_contract.py

      - name: Require generated Pages artifacts and metrics to be committed
        run: |
          git add --intent-to-add -- docs/index.html docs/data docs/robots.txt docs/sitemap.xml docs/.nojekyll data/project_metrics.json
          git diff --exit-code -- docs/index.html docs/data docs/robots.txt docs/sitemap.xml docs/.nojekyll data/project_metrics.json

      - name: Check whitespace
        run: git diff --check
